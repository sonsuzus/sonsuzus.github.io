---
layout: default
---

<header>
  <h1 class="post-title">{{ page.title }}</h1>
</header>
<div class="content">
  {% if page.math %}
      {% include mathjax.html %}
  {% endif %}
  {% include post-meta.html post=page %}

  <div class="post-body">
  
    {{ content }}
    {% include post-tags.html post=page %}
    
    {% include social-share-buttons.html %}
    
  </div>

  {% include comments.html %}
  {% include related_posts.html %}
</div>
