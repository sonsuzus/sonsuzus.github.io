<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Social Share Buttons</title>
</head>
<body>
    <div class="social-share-buttons">
        <a href="https://www.facebook.com/sharer/sharer.php?u={URL}" target="_blank"><i class="fab fa-facebook-square"></i> Facebook</a>
        <a href="https://twitter.com/intent/tweet?url={URL}&text={TEXT}&via={USERNAME}" target="_blank"><i class="fab fa-twitter-square"></i> X (Twitter)</a>
        <a href="https://www.linkedin.com/shareArticle?mini=true&url={URL}&title={TITLE}&summary={SUMMARY}&source={SOURCE}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
        <a href="https://api.whatsapp.com/send?text={TEXT} %20{URL}" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="https://telegram.me/share/url?url={URL}&text={TEXT}" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
    </div>
</body>
</html>
