{% assign share_url = page.url | absolute_url | cgi_escape %}
{% assign share_title = page.title | cgi_escape %}
{% assign share_excerpt = page.excerpt | strip_html | strip_newlines | truncate: 160 | cgi_escape %}

<div class="social-share-buttons">
    <p><strong>Bu yazıyı paylaş:</strong></p>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener noreferrer" class="share-btn facebook"><i class="fab fa-facebook-square"></i> <span>Facebook</span></a>
    <a href="https://twitter.com/intent/tweet?url={{ share_url }}&text={{ share_title }}" target="_blank" rel="noopener noreferrer" class="share-btn twitter"><i class="fab fa-twitter-square"></i> <span>X (Twitter)</span></a>
	<a href="https://www.threads.net/intent/post?text={{ share_title }}%20{{ share_url }}" target="_blank" rel="noopener noreferrer" class="share-btn threads"><i class="fa-brands fa-threads"></i> <span>Threads</span></a>
    <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ share_url }}&title={{ share_title }}&summary={{ share_excerpt }}" target="_blank" rel="noopener noreferrer" class="share-btn linkedin"><i class="fab fa-linkedin"></i> <span>LinkedIn</span></a>
    <a href="https://api.whatsapp.com/send?text={{ share_title }}%20{{ share_url }}" target="_blank" rel="noopener noreferrer" class="share-btn whatsapp"><i class="fab fa-whatsapp"></i> <span>WhatsApp</span></a>
    <a href="https://t.me/share/url?url={{ share_url }}&text={{ share_title }}" target="_blank" rel="noopener noreferrer" class="share-btn telegram"><i class="fab fa-telegram"></i> <span>Telegram</span></a>
</div>
