<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Mevcut URL'yi kontrol et
      const currentURL = window.location.href;
      
      // URL sonu slash ile bitiyorsa
      if (currentURL.endsWith('/') && currentURL.length > 1) {
        // Sondaki slash'ı kaldır
        const cleanURL = currentURL.slice(0, -1);
        
        // Yeni URL'ye yönlendir ve sayfayı yenile
        window.location.href = cleanURL;
        console.log('URL temizlendi ve sayfa yenileniyor: ' + cleanURL);
      }
    });
  </script><!-- Additional head bits without overriding original head -->
