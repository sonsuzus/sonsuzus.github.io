<head>
  <!-- YENI SITE YONLENDIRMESI VE SEO (JS + META + CANONICAL) -->
  <meta http-equiv="refresh" content="0; url=https://program.sonsuz.us{{ page.url | replace:'index.html','' }}">
  <link rel="canonical" href="https://program.sonsuz.us{{ page.url | replace:'index.html','' }}">
  <script>
    if (window.location.hostname === 'sonsuzus.github.io') {
      window.location.replace('https://program.sonsuz.us' + window.location.pathname + window.location.search + window.location.hash);
    }
  </script>
  <!-- YENI SITE YONLENDIRMESI SONU -->

  <link href="https://gmpg.org/xfn/11" rel="profile" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  
  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}{% if site.tagline %} &middot; {{ site.tagline }}{% endif %}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  {% include google-analytics.html %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
  {% include font-includes.html %}

  <!-- Icons -->
  {% include favicons.html %}

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.feed.path | default: 'feed.xml' | relative_url }}" />

  {% include custom-head.html %}
</head>
